  /catalog/barcodes/resolve:
    post:
      operationId: resolveBarcode
      tags:
      - Catalog
      summary: تشخیص بارکد و پیشنهاد مشخصات
      description: 'Sample barcode values are illustrative and not guaranteed real GTINs. Never returns another tenant''s
        price/stock/ids (P0-8). Providers time out at 2s each, 4s total; degraded=true when skipped. A weighted label (CAT-007)
        is decoded first: its item code is looked up as the variant''s internal code and `normalized.weighted.value` is kilograms
        (3 decimals) or rials; a wrong value check digit is 422 invalid-barcode. `unitPrice` is the default list''s price
        now; with it a weighted label also gets `quantity` and `amount` (a price label''s amount is the printed price, CAT-007.1).
        Implemented so far: the tenant source only (global catalog and providers: US-043).'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarcodeResolveRequest'
            examples:
              gtin:
                summary: EAN-13
                value:
                  barcode: '6260000000017'
                  branchId: a0000000-0000-0000-0000-000000000001
                  preferredSources:
                  - tenant
                  - global
                  - licensed_providers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeResolveResponse'
              examples:
                candidates:
                  summary: دو پیشنهاد متعارض
                  value:
                    kind: candidates
                    normalized:
                      gtin14: '06260000000017'
                      isInternal: false
                      isWeighted: false
                    candidates:
                    - source: global
                      confidence: '0.92'
                      lastVerifiedAt: '2026-10-01T08:00:00Z'
                      license: null
                      attribution: null
                      fields:
                        name: شیر کم‌چرب ۱ لیتری
                        brand: نمونه
                      conflictsWith:
                      - 1
                    - source: open_food_facts
                      confidence: '0.61'
                      lastVerifiedAt: '2026-09-12T10:00:00Z'
                      license: ODbL-1.0
                      attribution: Open Food Facts contributors
                      fields:
                        name: Low fat milk 1L
                      conflictsWith:
                      - 0
                    degraded: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
