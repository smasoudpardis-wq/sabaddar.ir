components:
  securitySchemes:
    merchantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm `merchant`, aud `merchant-api`. Sent by the BFF only.
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Issued by RetailCloud CustomerIdentity after OTP (not Keycloak, ADR-003 §6 as amended); iss retailcloud-customer,
        aud customer-api; held by the portal BFF only.
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Realm `platform`, aud `platform-api`; WebAuthn + IP allowlist (AUTH-13).
    integrationKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Tenant integration key with scopes (INT-001).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated unique key (UUID/ULID), 16–64 chars. Same key + same payload replays the stored success
        (same status, identical body, header Idempotent-Replayed: true); same key + different payload or path -> 409 idempotency-key-reused;
        a duplicate still running after 5 s -> 409 in-progress with Retry-After (BR-030/031, D-34).'
      schema:
        type: string
        minLength: 16
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    BranchFilter:
      name: branchId
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/expired credentials, or wrong audience (BR-004).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Permission/scope denied, mfa-required, step-up-required, entitlement-exceeded, or approval-required (with
        approvalRequestId).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found — also returned for resources of another tenant (BR-003, D-48).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business conflict (version-conflict, insufficient-stock, price-changed, period-closed, ...).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed; see errors[].
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded; see Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds
  schemas:
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        accountType:
          type: string
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        isSystem:
          type: boolean
        requiresDetail:
          type: boolean
      required:
      - id
      - code
      - name
      - accountType
      - parentId
      - isSystem
      - requiresDetail
    AccountCreate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
        accountType:
          type: string
          enum:
          - Asset
          - Liability
          - Equity
          - Revenue
          - Expense
        parentId:
          type: string
          format: uuid
        requiresDetail:
          type: boolean
      required:
      - code
      - name
      - accountType
    AccountMappingSet:
      type: object
      additionalProperties: false
      properties:
        mappings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              role:
                type: string
              accountId:
                type: string
                format: uuid
              branchId:
                type: string
                format: uuid
            required:
            - role
            - accountId
      required:
      - mappings
    ActiveTenantSelect:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          type: string
          format: uuid
      required:
      - tenantId
    Adjustment:
      type: object
