      - legalName
      - industryCode
      - timeZone
      - baseCurrency
      - pricingMode
      - status
      - version
      - plan
      - trialEndsAt
      - entitlements
      - readOnlyReason
    TenantCustomer:
      type: object
      additionalProperties: false
      properties:
        tenantCustomerId:
          type: string
          format: uuid
        maskedName:
          type: string
        maskedPhone:
          type: string
        joinedAt:
          type: string
          format: date-time
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentState'
        phone:
          type: string
          description: Full phone only with customers.pii.view; audited (BR-062)
      required:
      - tenantCustomerId
      - maskedName
      - maskedPhone
      - joinedAt
      - consents
    TenantRegistration:
      type: object
      additionalProperties: false
      properties:
        legalName:
          type: string
        industryCode:
          type: string
          enum:
          - supermarket
          - apparel
          - general
        timeZone:
          type: string
        pricingMode:
          type: string
          enum:
          - TaxExclusive
          - TaxInclusive
        firstBranchName:
          type: string
      required:
      - legalName
      - industryCode
      - firstBranchName
    TenantSetup:
      type: object
      additionalProperties: false
      properties:
        complete:
          type: boolean
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                enum:
                - branch-and-register
                - warehouse
                - chart-of-accounts
                - fiscal-periods
              complete:
                type: boolean
            required:
            - name
            - complete
      required:
      - complete
      - steps
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
        legalName:
          type: string
        timeZone:
          type: string
        pricingMode:
          type: string
          enum:
          - TaxExclusive
          - TaxInclusive
        returnWindowDays:
          type: integer
          format: int32
        negativeStockPolicy:
          type: string
          enum:
          - Forbid
          - AllowWithWarning
      required:
      - expectedVersion
    Tender:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int32
        method:
          type: string
          enum:
          - Cash
          - ExternalCardTerminal
          - OnlineGateway
          - CustomerCredit
          - StoreCredit
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
          - Confirmed
          - Pending
          - Failed
        paymentId:
          type:
          - string
          - 'null'
          format: uuid
        reference:
          type:
          - string
          - 'null'
      required:
      - seq
      - method
      - amount
      - status
      - paymentId
      - reference
    TenderInput:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
          - Cash
          - ExternalCardTerminal
          - CustomerCredit
          - StoreCredit
        amount:
          $ref: '#/components/schemas/Money'
        tendered:
          $ref: '#/components/schemas/Money'
          description: 'Cash only: amount handed over; change is computed (SAL-006.1)'
        referenceNo:
          type: string
          description: 'ExternalCardTerminal: tracking/reference number (PAY-002)'
        terminalNo:
          type: string
        cardLast4:
          type: string
        approvalId:
          type: string
          format: uuid
      required:
      - method
      - amount
    Terminal:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        deviceName:
          type: string
        pairedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - Active
          - Revoked
        deviceSecret:
          type: string
          description: Only in the pairTerminal response; kept by the BFF, never by page scripts
      required:
      - id
      - branchId
      - deviceName
      - pairedAt
      - status
    TerminalPairRequest:
      type: object
      additionalProperties: false
      properties:
        pairingCode:
          type: string
        deviceName:
          type: string
        userAgent:
          type: string
      required:
      - pairingCode
      - deviceName
    Transfer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Completed
        postedAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - postedAt
    TransferCreate:
      type: object
      additionalProperties: false
      properties:
        fromWarehouseId:
          type: string
          format: uuid
        toWarehouseId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              variantId:
                type: string
                format: uuid
              qty:
                $ref: '#/components/schemas/Quantity'
            required:
            - variantId
            - qty
      required:
      - fromWarehouseId
      - toWarehouseId
      - lines
    TrialBalanceRow:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          format: uuid
        accountCode:
          type: string
        accountName:
          type: string
        openingDebit:
          $ref: '#/components/schemas/Money'
        openingCredit:
          $ref: '#/components/schemas/Money'
        periodDebit:
          $ref: '#/components/schemas/Money'
        periodCredit:
          $ref: '#/components/schemas/Money'
        closingDebit:
          $ref: '#/components/schemas/Money'
        closingCredit:
          $ref: '#/components/schemas/Money'
      required:
      - accountId
      - accountCode
      - accountName
      - openingDebit
      - openingCredit
      - periodDebit
      - periodCredit
      - closingDebit
      - closingCredit
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          enum:
          - Invited
          - Active
          - Disabled
        roleAssignments:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          format: int32
      required:
      - id
      - displayName
      - status
      - roleAssignments
      - lastLoginAt
      - version
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - Active
          - Disabled
        displayName:
          type: string
      required:
      - expectedVersion
    Variant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        axisValues:
          type: object
          additionalProperties: false
          properties:
            color:
              type: string
            size:
              type: string
            model:
              type: string
        status:
          type: string
          enum:
          - Active
          - Inactive
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/Barcode'
        unitPrice:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      required:
      - id
      - sku
      - axisValues
      - status
      - barcodes
      - unitPrice
    VariantInput:
      type: object
      additionalProperties: false
      properties:
        sku:
          type: string
        axisValues:
          type: object
          additionalProperties: false
          properties:
            color:
              type: string
            size:
              type: string
            model:
              type: string
        unitPrice:
          $ref: '#/components/schemas/Money'
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/BarcodeInput'
      required:
      - sku
    VariantUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
          description: The product's version
        status:
          type: string
          enum:
          - Active
          - Inactive
      required:
      - expectedVersion
      - status
    VersionOnly:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
      required:
      - expectedVersion
    Warehouse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        code:
          type: string
        kind:
          type: string
      required:
      - id
      - branchId
      - code
      - kind
    WarehouseCreate:
      type: object
      additionalProperties: false
      properties:
        branchId:
          type: string
          format: uuid
        code:
          type: string
        kind:
          type: string
          enum:
          - Sellable
          - ReturnsDamaged
      required:
      - branchId
      - code
    WeightedBarcodeProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        prefix:
          type: string
          description: 1-3 digits starting with 2 (GS1 restricted circulation)
        itemCodeLength:
          type: integer
          format: int32
          description: 1-6; the item code is the variant's internal code (its PLU on the scale)
        valueType:
          type: string
          enum:
          - Weight
          - Price
        valueLength:
          type: integer
          format: int32
        decimals:
          type: integer
          format: int32
          description: 'Weight: kilogram decimals 0-3; Price: 0 (whole rials)'
        hasInnerCheckDigit:
          type: boolean
          description: GS1 value check digit before a 4- or 5-digit value. prefix + itemCodeLength + valueLength (+1) = 12,
            the data digits of an EAN-13
      required:
      - prefix
      - itemCodeLength
      - valueType
      - valueLength
      - decimals
      - hasInnerCheckDigit
    WeightedBarcodeProfileSet:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int32
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/WeightedBarcodeProfile'
      required:
      - version
      - profiles
    WeightedBarcodeProfileSetUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/WeightedBarcodeProfile'
      required:
      - expectedVersion
      - profiles
    WriteOffCreate:
      type: object
      additionalProperties: false
      properties:
        chargeIds:
          type: array
          items:
            type: string
            format: uuid
        reason:
          type: string
        approvalId:
          type: string
          format: uuid
      required:
      - chargeIds
      - reason
      - approvalId
x-error-catalog:
  version-conflict:
    status: 409
    meaning: expectedVersion mismatch (BR-034)
  idempotency-key-reused:
    status: 409
    meaning: Same key, different payload (BR-031)
  in-progress:
    status: 409
    meaning: Same key still processing; retry after Retry-After
  insufficient-stock:
    status: 409
    meaning: context.shortages[] (INV-003)
  price-changed:
    status: 409
    meaning: context.lines[] new prices; re-confirm (SAL-005.1)
  payment-not-confirmed:
    status: 409
    meaning: A tender is not confirmed yet
  payment-failed:
    status: 409
    meaning: Gateway verify failed
  period-closed:
    status: 409
    meaning: Fiscal period closed (DI-042)
  no-open-period:
    status: 422
    meaning: No fiscal period covers this date (ACC-001.1)
  barcode-not-found:
    status: 404
    meaning: 'No product of this store has this code: define it (UC-01) or search by name (UC-02 2a)'
  price-missing:
    status: 422
    meaning: The product has no price in the default list yet (CAT-009)
  not-sellable:
    status: 422
    meaning: The product or its combination is switched off (CAT-008)
  weighted-line:
    status: 409
    meaning: A weighed item's quantity comes from its label (CAT-007)
  sale-not-draft:
    status: 409
    meaning: Only a draft cart changes (RC026)
  client-draft-id-taken:
    status: 409
    meaning: The clientDraftId belongs to another sale (DI-010)
  account-role-unmapped:
    status: 422
    meaning: An automatic entry needs an account role with no account mapped (ACC-004, D-30)
  journal-not-draft:
    status: 409
    meaning: Only a draft entry can be posted (ACC-003)
  journal-already-reversed:
    status: 409
    meaning: An entry is reversed once (DI-045)
  sale-finalized:
    status: 409
    meaning: Finalized sale is immutable (DI-003)
  shift-not-open:
    status: 409
    meaning: Cashier has no open shift on this register (BR-050)
  shift-already-open:
    status: 409
    meaning: Register already has an open shift (DI-008)
  variance-not-pending:
    status: 409
    meaning: The shift has no variance waiting for approval (UC-06)
  barcode-already-assigned:
    status: 409
    meaning: context.productId (CAT-006)
  duplicate-reference:
    status: 409
    meaning: Card terminal reference already used (PAY-002.1)
  credit-limit-exceeded:
    status: 409
    meaning: context.available (BR-082)
  credit-overdue:
    status: 409
    meaning: Overdue charges block new credit (BR-082)
  credit-account-suspended:
    status: 409
    meaning: CRD-008
  exceeds-returnable-quantity:
    status: 422
    meaning: BR-053
  confirmation-required:
    status: 422
    meaning: Low-confidence catalog data (CAT-004.1) or UC-05 receipt warnings (context.warnings[]) must be confirmed
  unknown-unit:
    status: 422
    meaning: The unit has no conversion to the product's base unit (BR-044); context.units[]
  duplicate-national-id:
    status: 409
    meaning: A supplier with this national id already exists (PRC-001)
  invalid-barcode:
    status: 422
    meaning: Check digit/format (CAT-003)
  approval-required:
    status: 403
    meaning: approvalRequestId returned; retry with approvalId (IAM-007)
  mfa-required:
    status: 403
    meaning: IAM-003
  step-up-required:
    status: 403
    meaning: ABAC-05
  entitlement-exceeded:
    status: 403
    meaning: TEN-003
  owner-only:
    status: 403
    meaning: 'Only a TenantOwner may do this, even with the permission (SoD-05: support access)'
  support-access-not-open:
    status: 409
    meaning: The support request is no longer pending, or the grant already ended (IAM-008)
  export-in-progress:
    status: 409
    meaning: One export at a time per store (TEN-005, TM-015)
  tenant-read-only:
    status: 403
    meaning: 'Suspended, closed or trial-expired tenant: writes refused except x-allowed-when-read-only (TEN-004)'
  terminal-not-registered:
    status: 403
    meaning: ABAC-04
  qr-expired:
    status: 401
    meaning: Customer QR expired or already used (CUS-005)
  invalid-qr:
    status: 401
    meaning: Wrong audience/signature
  otp-invalid:
    status: 422
    meaning: Wrong/expired OTP; attempts remaining in context
  rate-limited:
    status: 429
    meaning: Generic rate limit
  not-found:
    status: 404
    meaning: Not found or belongs to another tenant — indistinguishable (BR-003, D-48)
  invalid-token:
    status: 401
    meaning: Token lacks required claims
  user-not-provisioned:
    status: 403
    meaning: Valid identity but no active RetailCloud user (IAM-001, IAM-009)
  tenant-not-selected:
    status: 403
    meaning: Tenant-scoped operation without an active tenant (BR-001)
  idempotency-key-required:
    status: 400
    meaning: Missing or malformed Idempotency-Key on an operation of BR-030
  validation:
    status: 400
    meaning: Malformed request body or parameters; context.errors[]
  internal:
    status: 500
    meaning: Unexpected error; details only in logs, correlate with traceId (SEC-T-016)
  forbidden:
    status: 403
    meaning: The caller's roles do not grant the permission at this scope (IAM-006, D06 §6.1)
  duplicate-assignment:
    status: 409
    meaning: The user already has this role at this scope
  last-owner:
    status: 409
    meaning: A tenant must keep at least one active TenantOwner
  cannot-disable-self:
    status: 409
    meaning: A user cannot disable their own access (updateUser)
  pin-invalid:
    status: 403
    meaning: Wrong PIN; context attemptsLeft (AUTH-08)
  pin-locked:
    status: 403
    meaning: PIN locked after 5 failures; a full sign-in and a new PIN are needed
  pin-not-set:
    status: 409
    meaning: The user has not set a PIN
  reauth-required:
    status: 403
    meaning: Sign in again (setting a PIN needs a sign-in within 10 minutes)
  self-approval:
    status: 403
    meaning: The requester cannot approve their own request (SoD-01)
  approval-expired:
    status: 409
    meaning: The pending request expired (10 minutes)
  approval-not-pending:
    status: 409
    meaning: The request was already decided
  duplicate-code:
    status: 409
    meaning: Branch code (per tenant), register code (per branch), product SKU (per tenant) or variant axis values (per product,
      DI-081) already used
