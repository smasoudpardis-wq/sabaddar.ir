# Local development stack (D11 §1 "Dev"). Not for production: no TLS, dev-mode OpenBao, default credentials.
# Usage: docker compose -f src/backend/dev/compose.yaml up -d
name: retailcloud-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailcloud
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../../docs/05-data/sql:/rc-sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
  openbao:
    image: quay.io/openbao/openbao:2.1.0
    command: server -dev -dev-root-token-id=dev-root
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]
volumes:
  pgdata: {}
  miniodata: {}
